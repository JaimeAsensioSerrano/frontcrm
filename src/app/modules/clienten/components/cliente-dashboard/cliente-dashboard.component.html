<div style="background-color: #141414; min-height: 91vh; padding-top: 10px;">

  <mat-card style="margin: 10px auto; border-radius: 10px;" class="child" *ngFor="let car of cars">

    <mat-card-content style="display: flex; gap: 20px; padding: 15px;">

      <div style="flex: 0 0 auto;">
        <img class="profile" style="height: 130px; width: 200px; border-radius: 10px; object-fit: cover;"
          [src]="car.processedImg" alt="profile" />
      </div>

      <div style="flex: 1;">
        <h2 style="cursor: pointer; color: #a68e45 ; margin-top: 0;">
          {{car.brand}} - {{car.name}}
        </h2>
        <p>{{car.description}}</p>

        <mat-divider></mat-divider>

        <h5 style="margin: 15px 0; font-weight: normal;">
          Price : <b>${{car.price}}</b> -
          Color : <b>{{car.color}}</b> -
          Transmission : <b>{{car.transmission}}</b> -
          Type : <b>{{car.type}}</b> -
          Year : <b>{{car.year}}</b>
        </h5>

        <mat-divider></mat-divider>
      </div>

    </mat-card-content>
  </mat-card>

</div>
