<div style="background-color: #141414; min-height: 91vh; padding-top: 20px; display: flex; flex-direction: column; align-items: center;">

  <mat-card class="car-card child" *ngFor="let car of cars" style="width: 85%; max-width: 1100px; margin-bottom: 20px;">
    
    <mat-card-content class="car-card-content">
      
      <div class="car-image-container">
        <img class="car-image" [src]="car.processedImg" alt="profile">
      </div>

      <div class="car-details">
        <h2 class="car-title">{{ car.brand }} - {{ car.name }}</h2>
        <p class="car-description">{{ car.description }}</p>
        
        <div class="car-info-grid">
          <span><strong>Precio:</strong> ${{ car.price }}</span>
          <span><strong>Color:</strong> {{ car.color }}</span>
          <span><strong>Transmisión:</strong> {{ car.transmission }}</span>
          <span><strong>Tipo:</strong> {{ car.type }}</span>
          <span><strong>Año:</strong> {{ car.year }}</span>
        </div>
      </div>

    </mat-card-content>
  </mat-card>

</div>
